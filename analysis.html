<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>分析 | WaterPolo Analyzer</title>

    <link rel="stylesheet" href="css/common.css">

    <link rel="stylesheet" href="css/analysis.css">

</head>

<body>

<header>

    <h1>📊 WaterPolo Analyzer</h1>

</header>

<main>

    <!-- =========================
         練習分析
    ========================== -->

    <h2>🏊 練習分析</h2>

    <section class="cardArea">

        <div class="card">

            <h3>シュート数</h3>

            <p id="practiceShot">0</p>

        </div>

        <div class="card">

            <h3>ゴール</h3>

            <p id="practiceGoal">0</p>

        </div>

        <div class="card">

            <h3>成功率</h3>

            <p id="practiceRate">0%</p>

        </div>

    </section>

    <table>

        <thead>

            <tr>

                <th>選手</th>

                <th>シュート</th>

                <th>ゴール</th>

                <th>成功率</th>

            </tr>

        </thead>

        <tbody id="practiceTable">

        </tbody>

    </table>

    <!-- =========================
         試合分析
    ========================== -->

    <h2>🤽 試合分析</h2>

    <section class="cardArea">

        <div class="card">

            <h3>シュート数</h3>

            <p id="matchShot">0</p>

        </div>

        <div class="card">

            <h3>ゴール</h3>

            <p id="matchGoal">0</p>

        </div>

        <div class="card">

            <h3>成功率</h3>

            <p id="matchRate">0%</p>

        </div>

    </section>

    <table>

        <thead>

            <tr>

                <th>選手</th>

                <th>シュート</th>

                <th>ゴール</th>

                <th>成功率</th>

            </tr>

        </thead>

        <tbody id="matchTable">

        </tbody>

    </table>

    <!-- =========================
         シュート位置分析
    ========================== -->

    <h2>📍 シュート位置分析</h2>

    <section class="control">

        <select id="playerFilter">

            <option value="all">

                全選手

            </option>

        </select>

        <select id="dataFilter">

            <option value="practice">

                練習

            </option>

            <option value="match">

                試合

            </option>

        </select>

        <select id="quarterFilter">

            <option value="all">

                全Q

            </option>

            <option value="1Q">1Q</option>

            <option value="2Q">2Q</option>

            <option value="3Q">3Q</option>

            <option value="4Q">4Q</option>

        </select>

        <select id="menuFilter">

            <option value="all">

                全メニュー

            </option>

        </select>

        <select id="resultFilter">

            <option value="all">

                全結果

            </option>

            <option value="goal">

                ゴール

            </option>

            <option value="miss">

                外れ

            </option>

            <option value="gk">

                GKセーブ

            </option>

        </select>

    </section>

    <!-- コート -->

    <div id="analysisCourt">

        <div class="centerLine"></div>

        <div class="goal leftGoal"></div>

        <div class="goal rightGoal"></div>

    </div>

    <br>

    <a href="index.html">

        <button>

            🏠 ホームへ戻る

        </button>

    </a>

</main>

<script type="module" src="js/analysis.js"></script>

</body>

</html>
